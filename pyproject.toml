[project]
name = "doppelgone"
version = "0.1.0"
description = "Pick the best of similar photos in Immich, using local models only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pillow>=10",
    "numpy",
    "opencv-python-headless",
    "torch",
    "transformers",
    "torchvision",
    "mediapipe",
    # Vision model backend: MLX on Apple Silicon, transformers (4-bit on NVIDIA GPUs) everywhere else.
    "mlx-vlm; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "accelerate; sys_platform != 'darwin'",
    "bitsandbytes; sys_platform != 'darwin'",
]

[tool.uv]
package = false

# PyPI's Windows builds of torch are CPU-only, so Windows takes the CUDA builds from PyTorch's own index.
[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
